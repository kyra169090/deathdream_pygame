name: Build Windows Download

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - desktop/windows-downloadable

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: requirements-desktop.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt

      - name: Build one-folder Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm Deathdream.spec

      - name: Create itch.io ZIP and SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path ".\dist\Deathdream\*" -DestinationPath ".\release\Deathdream-Windows.zip" -CompressionLevel Optimal -Force
          $hash = Get-FileHash -Algorithm SHA256 ".\release\Deathdream-Windows.zip"
          "$($hash.Hash.ToLower())  Deathdream-Windows.zip" | Set-Content ".\release\SHA256SUMS.txt" -Encoding ascii

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deathdream-Windows
          path: release/
          if-no-files-found: error
